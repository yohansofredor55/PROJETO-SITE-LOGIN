<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <nav class="menu">
        <a class="link" href="index.html">Home</a>
        <a class="link" href="galeria.html">Galeria</a>
        <a class="link" href="chat.html">Chat</a>
        <a class="link" href="login.html">Login</a>
        <a class="link" href="cadastro.html">Cadastro</a>
    </nav>
    
    <div class="conteiner-cadastro">
        <div class="conteiner-ch1">
            <h2>Login</h2><br>
        </div>

        <div class="login">
           

            <label for="loginEmail">email</label><br>
            <input type="email" id="loginEmail" placeholder="Digite seu email" required><br><br>

            <label for="loginSenha">senha</label><br>
            <input type="password" id="loginSenha" placeholder="Digite sua senha" required><br><br>

            <button id="btnlogin" class="card">Enviar</button>
            <div id="loginMensagem" class="mensagem"></div>
        </div>
    </div>

    <footer>
        <p>©Desenvolvido por Yohan Denk</p>
    </footer>

    <script>
        const btnlogin = document.querySelector('#btnlogin');
        const loginMensagem = document.querySelector('#loginMensagem');

        btnlogin.addEventListener('click', async ()=>{
          
            const emailEntrada = document.querySelector('#loginEmail');
            const senhaEntrada = document.querySelector('#loginSenha');

            
            const email = emailEntrada.value;
            const senha = senhaEntrada.value;

            if ( !email || !senha) {
                loginMensagem.innerText = 'Preencha todos os campos antes de enviar!'
                loginMensagem.style.color = 'red';
                return;
            }

            loginMensagem.innerText = 'Dados enviados aguarde 5 segundos...';
            loginMensagem.style.color = 'orange';

            try{
                const respostaBE = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        
                        email: email,
                        senha: senha
                    })
                });

                const dados = await respostaBE.json();

                if(!respostaBE.ok) {
                    loginMensagem.innerText = `${dados.erro}`;
                    loginMensagem.style.color = 'red';
                    return;
                }

                // Guarda a sessao para o chat reconhecer o usuario (era isso que faltava e causava o loop)
                const token = dados.token || dados.accessToken || dados.jwt;
                const nomeUsuario = dados.usuario || dados.nome || dados.perfil;

                if (!token || !nomeUsuario) {
                    console.error('Resposta do /login sem token ou nome:', dados);
                    loginMensagem.innerText = 'O servidor nao enviou o token ou o nome do usuario.';
                    loginMensagem.style.color = 'red';
                    return;
                }

                localStorage.setItem('token', token);
                localStorage.setItem('usuario', nomeUsuario);

                loginMensagem.innerText = `${dados.mensagem}: ${nomeUsuario}`;
                loginMensagem.style.color = '#39ff88';

                emailEntrada.value = '';
                senhaEntrada.value = '';

                setTimeout(() => {
                    window.location.href = 'chat.html';
                }, 800);
            }
            catch(erro) {
                console.error('Erro na requisição:', erro);
                loginMensagem.innerText = 'Erro ao conectar com o servidor!!';
                loginMensagem.style.color = 'red';
            }
        });
    </script>
</body>

</html>
